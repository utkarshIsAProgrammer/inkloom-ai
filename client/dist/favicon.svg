<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="crestRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Luxury Diamond/Shield Silhouette -->
  <path d="M50 6 L88 24 L88 56 Q88 80 50 94 Q12 80 12 56 L12 24 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#crestGold)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Inner Hairline Bevel -->
  <path d="M50 14 L80 28 L80 54 Q80 74 50 86 Q20 74 20 54 L20 28 Z" 
        stroke="rgba(255,255,255,0.12)" 
        stroke-width="1" 
        fill="none"/>

  <!-- Royal Central Neural Monogram 'I' + Cross Geometric Nodes -->
  <path d="M50 24 L50 76" stroke="url(#crestGold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 34 L64 34" stroke="url(#crestGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 66 L66 66" stroke="url(#crestGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ruby Core Diamond Eye -->
  <polygon points="50,42 58,50 50,58 42,50" fill="url(#crestRuby)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="2" fill="#FFFFFF"/>

  <!-- Precision Corner Nodes -->
  <circle cx="50" cy="24" r="2.5" fill="#FCD34D"/>
  <circle cx="50" cy="76" r="2.5" fill="#FCD34D"/>
  <circle cx="36" cy="34" r="2" fill="#F59E0B"/>
  <circle cx="64" cy="34" r="2" fill="#F59E0B"/>
  <circle cx="34" cy="66" r="2" fill="#F59E0B"/>
  <circle cx="66" cy="66" r="2" fill="#F59E0B"/>
</svg>
